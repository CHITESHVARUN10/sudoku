<style>
        body {
            background-color: theme('colors.paper-white');
            color: theme('colors.ink-black');
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        .blinking-cursor {
            animation: blink 1s step-end infinite;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
        .border-hairline {
            border-width: 1px;
            border-color: theme('colors.ink-black');
        }
    </style>

<body class="min-h-screen flex flex-col items-start justify-center p-margin-lg md:pl-24 lg:pl-48">
<main class="w-full max-w-2xl">
<div class="mb-margin-lg w-full">
<h3 class="font-label-mono text-label-mono uppercase tracking-widest text-note-gray mb-4">INVITE</h3>
<div class="w-full border-t border-hairline mb-8"></div>
<h1 class="font-display-lg text-display-lg mb-margin-md">Waiting for Player 2</h1>
</div>
<div class="mb-margin-lg">
<div class="border-hairline p-margin-md inline-block mb-4">
<span class="font-grid-number text-grid-number tracking-widest text-ink-black">SD-882-QX</span>
</div>
<div>
<button class="font-body-md text-body-md text-ink-black hover:underline decoration-1 underline-offset-4 bg-transparent border-none cursor-pointer focus:outline-none focus:ring-1 focus:ring-ink-black focus:ring-offset-2 p-1 -ml-1 transition-all">Copy Link</button>
</div>
</div>
<div class="flex items-center space-x-2 mb-margin-lg mt-margin-md">
<span class="font-label-mono text-label-mono text-ink-black">Awaiting opponent</span>
<span class="font-label-mono text-label-mono text-ink-black blinking-cursor">_</span>
</div>
<div class="mt-margin-lg pt-margin-lg">
<a class="font-body-md text-body-md text-note-gray hover:text-ink-black transition-colors underline decoration-1 underline-offset-4" href="#">Cancel</a>
</div>
</main>
<script>
        // Copy to clipboard functionality placeholder
        document.querySelector('button').addEventListener('click', function(e) {
            const code = 'SD-882-QX';
            navigator.clipboard.writeText(code).then(() => {
                const originalText = e.target.textContent;
                e.target.textContent = 'Copied';
                setTimeout(() => {
                    e.target.textContent = originalText;
                }, 2000);
            });
        });
    </script>
</body></html>
