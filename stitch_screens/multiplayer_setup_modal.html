<!DOCTYPE html>

<html class="h-full" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>SUDOKU - Multiplayer Setup</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;600;700&amp;family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "surface-variant": "#e4e2dd",
                    "surface-container": "#f0eee9",
                    "surface-container-high": "#eae8e3",
                    "paper-white": "#F7F5F0",
                    "on-secondary-fixed": "#1c1b1b",
                    "ink-black": "#1A1A1A",
                    "surface": "#fbf9f4",
                    "on-tertiary-fixed": "#261900",
                    "primary-fixed-dim": "#b7c7e8",
                    "tertiary-fixed": "#fddfa8",
                    "outline": "#75777e",
                    "error-container": "#ffdad6",
                    "surface-container-lowest": "#ffffff",
                    "surface-dim": "#dbdad5",
                    "on-surface": "#1b1c19",
                    "on-background": "#1b1c19",
                    "primary": "#15243e",
                    "on-error": "#ffffff",
                    "on-primary-container": "#95a4c4",
                    "outline-variant": "#c5c6ce",
                    "secondary-container": "#e2dfde",
                    "surface-bright": "#fbf9f4",
                    "on-tertiary-container": "#baa06f",
                    "on-primary-fixed-variant": "#384763",
                    "on-surface-variant": "#44474d",
                    "on-tertiary-fixed-variant": "#57441b",
                    "inverse-surface": "#30312e",
                    "secondary": "#5f5e5e",
                    "primary-container": "#2b3a55",
                    "error": "#ba1a1a",
                    "tertiary": "#312200",
                    "on-secondary-fixed-variant": "#474746",
                    "ink-blue": "#2B3A55",
                    "on-primary": "#ffffff",
                    "on-secondary": "#ffffff",
                    "on-error-container": "#93000a",
                    "surface-container-highest": "#e4e2dd",
                    "secondary-fixed": "#e5e2e1",
                    "surface-tint": "#505f7c",
                    "on-primary-fixed": "#0b1b35",
                    "tertiary-container": "#49370f",
                    "on-secondary-container": "#636262",
                    "surface-container-low": "#f5f3ee",
                    "primary-fixed": "#d7e3ff",
                    "on-tertiary": "#ffffff",
                    "error-red": "#9E2A2B",
                    "note-gray": "#7A7875",
                    "tertiary-fixed-dim": "#dfc38e",
                    "inverse-on-surface": "#f2f1ec",
                    "background": "#fbf9f4",
                    "secondary-fixed-dim": "#c8c6c5",
                    "inverse-primary": "#b7c7e8"
            },
            "borderRadius": {
                    "DEFAULT": "0rem",
                    "lg": "0rem",
                    "xl": "0rem",
                    "full": "9999px"
            },
            "spacing": {
                    "hairline": "1px",
                    "cell-size": "64px",
                    "margin-sm": "16px",
                    "margin-lg": "64px",
                    "margin-md": "32px",
                    "grid-unit": "4px"
            },
            "fontFamily": {
                    "grid-number": [
                            "JetBrains Mono"
                    ],
                    "headline-sm": [
                            "EB Garamond"
                    ],
                    "grid-notes": [
                            "JetBrains Mono"
                    ],
                    "headline-md": [
                            "EB Garamond"
                    ],
                    "label-mono": [
                            "JetBrains Mono"
                    ],
                    "body-md": [
                            "Inter"
                    ],
                    "display-lg": [
                            "EB Garamond"
                    ],
                    "body-lg": [
                            "Inter"
                    ]
            },
            "fontSize": {
                    "grid-number": [
                            "28px",
                            {
                                    "lineHeight": "28px",
                                    "fontWeight": "400"
                            }
                    ],
                    "headline-sm": [
                            "24px",
                            {
                                    "lineHeight": "32px",
                                    "fontWeight": "500"
                            }
                    ],
                    "grid-notes": [
                            "12px",
                            {
                                    "lineHeight": "12px",
                                    "fontWeight": "400"
                            }
                    ],
                    "headline-md": [
                            "32px",
                            {
                                    "lineHeight": "40px",
                                    "fontWeight": "500"
                            }
                    ],
                    "label-mono": [
                            "20px",
                            {
                                    "lineHeight": "20px",
                                    "fontWeight": "500"
                            }
                    ],
                    "body-md": [
                            "16px",
                            {
                                    "lineHeight": "24px",
                                    "fontWeight": "400"
                            }
                    ],
                    "display-lg": [
                            "48px",
                            {
                                    "lineHeight": "56px",
                                    "letterSpacing": "-0.02em",
                                    "fontWeight": "600"
                            }
                    ],
                    "body-lg": [
                            "18px",
                            {
                                    "lineHeight": "28px",
                                    "fontWeight": "400"
                            }
                    ]
            }
    },
        },
      }
    </script>
<style>
        /* Custom Utilities for Editorial Style */
        .hard-shadow {
            box-shadow: 2px 2px 0px 0px #1A1A1A;
        }
        .bg-grid-pattern {
            background-image: linear-gradient(#e4e2dd 1px, transparent 1px), linear-gradient(90deg, #e4e2dd 1px, transparent 1px);
            background-size: 64px 64px;
        }
    </style>
</head>
<body class="h-full bg-paper-white bg-grid-pattern font-body-md text-body-md text-ink-black flex flex-col items-center justify-center min-h-screen relative overflow-hidden">
<!-- Top Navigation (Context) -->
<nav class="absolute top-0 w-full border-b border-ink-black bg-paper-white z-10 flex justify-between items-center px-margin-lg h-16 max-w-[1440px] mx-auto border-b-hairline border-surface-variant flat no shadows">
<div class="font-headline-md text-headline-md font-bold text-ink-black uppercase tracking-tighter">
            SUDOKU
        </div>
<div class="hidden md:flex space-x-margin-md font-headline-sm text-headline-sm uppercase tracking-wider">
<a class="text-note-gray hover:text-ink-black transition-colors duration-150" href="#">DAILY</a>
<a class="text-note-gray hover:text-ink-black transition-colors duration-150" href="#">ARCHIVE</a>
<a class="text-note-gray hover:text-ink-black transition-colors duration-150" href="#">STATS</a>
</div>
<div class="flex items-center space-x-margin-sm">
<button class="font-headline-sm text-headline-sm uppercase tracking-wider hover:bg-surface-variant transition-colors duration-150 px-2 py-1 border border-ink-black">PLAY NOW</button>
</div>
</nav>
<!-- Overlay Background -->
<div class="absolute inset-0 bg-ink-black/20 backdrop-blur-[2px] z-20 flex items-center justify-center p-4">
<!-- Modal Panel -->
<div class="bg-paper-white border-[2px] border-ink-black w-full max-w-lg hard-shadow relative animate-[slideIn_0.3s_ease-out]">
<!-- Modal Header -->
<div class="border-b-[2px] border-ink-black p-margin-sm flex justify-between items-center bg-surface-variant">
<h2 class="font-headline-md text-headline-md m-0 uppercase tracking-tight">Multiplayer Setup</h2>
<button class="text-ink-black hover:text-error-red transition-colors flex items-center justify-center w-8 h-8 border border-ink-black bg-paper-white hover:bg-surface-variant">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
</div>
<!-- Modal Body -->
<div class="p-margin-md space-y-margin-lg">
<!-- Player Inputs -->
<div class="space-y-margin-sm">
<div class="group">
<label class="block font-label-mono text-grid-notes text-note-gray uppercase tracking-widest mb-1 group-focus-within:text-ink-blue transition-colors" for="player1">Player 1</label>
<input class="w-full bg-transparent border-0 border-b-[2px] border-ink-black p-0 py-2 font-headline-sm text-headline-sm focus:ring-0 focus:border-ink-blue focus:outline-none transition-colors placeholder:text-note-gray" id="player1" name="player1" type="text" value="Guest_01"/>
</div>
<div class="group">
<label class="block font-label-mono text-grid-notes text-note-gray uppercase tracking-widest mb-1 group-focus-within:text-ink-blue transition-colors" for="player2">Player 2</label>
<input class="w-full bg-transparent border-0 border-b-[2px] border-ink-black p-0 py-2 font-headline-sm text-headline-sm focus:ring-0 focus:border-ink-blue focus:outline-none transition-colors placeholder:text-surface-tint" id="player2" name="player2" placeholder="Waiting for opponent..." type="text"/>
</div>
</div>
<!-- Difficulty Selector -->
<div>
<label class="block font-label-mono text-grid-notes text-ink-black uppercase tracking-widest mb-3 border-b border-ink-black pb-1">Difficulty Protocol</label>
<div class="flex border-[2px] border-ink-black">
<button class="flex-1 py-2 font-label-mono text-grid-notes uppercase tracking-wider text-ink-black hover:bg-surface-variant border-r-[2px] border-ink-black transition-colors">Easy</button>
<button class="flex-1 py-2 font-label-mono text-grid-notes uppercase tracking-wider bg-ink-black text-paper-white border-r-[2px] border-ink-black transition-colors">Medium</button>
<button class="flex-1 py-2 font-label-mono text-grid-notes uppercase tracking-wider text-ink-black hover:bg-surface-variant border-r-[2px] border-ink-black transition-colors">Hard</button>
<button class="flex-1 py-2 font-label-mono text-grid-notes uppercase tracking-wider text-ink-black hover:bg-surface-variant transition-colors">Expert</button>
</div>
<p class="font-body-md text-grid-notes text-note-gray mt-2 text-right italic">Estimated time: 15-20 mins</p>
</div>
</div>
<!-- Modal Footer -->
<div class="p-margin-md border-t-[2px] border-ink-black bg-surface-container">
<button class="w-full bg-ink-black text-paper-white py-4 font-headline-sm text-label-mono uppercase tracking-[0.2em] hover:bg-ink-blue transition-colors hard-shadow border border-ink-black group flex items-center justify-center space-x-2">
<span>Initialize Match</span>
<span class="material-symbols-outlined group-hover:translate-x-1 transition-transform" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
</div>
</div>
<!-- Decorative Sidebar (Context) -->
<div class="absolute left-0 top-16 h-[calc(100vh-64px)] w-64 border-r border-ink-black bg-surface-container hidden lg:flex flex-col py-8 border-r-hairline border-surface-variant">
<div class="px-4 py-2 bg-ink-black text-paper-white font-bold mb-2">
<span class="material-symbols-outlined mr-2 align-middle" data-icon="groups">groups</span> Multiplayer
         </div>
<div class="px-4 py-2 text-ink-black hover:underline cursor-pointer opacity-50 pointer-events-none">
<span class="material-symbols-outlined mr-2 align-middle" data-icon="grid_view">grid_view</span> New Game
         </div>
</div>
</body></html>
