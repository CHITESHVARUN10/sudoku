<style>
        .sudoku-grid {
            display: grid;
            grid-template-columns: repeat(9, minmax(0, 1fr));
            gap: 1px;
            background-color: #1A1A1A;
            border: 2px solid #1A1A1A;
        }
        .sudoku-cell {
            background-color: #F7F5F0;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            cursor: pointer;
        }
        /* Thicker borders for 3x3 subgrids */
        .sudoku-cell:nth-child(3n) { border-right: 2px solid #1A1A1A; }
        .sudoku-cell:nth-child(n+19):nth-child(-n+27),
        .sudoku-cell:nth-child(n+46):nth-child(-n+54) { border-bottom: 2px solid #1A1A1A; }
        .sudoku-grid .sudoku-cell:nth-child(9n) { border-right: none; }
        
        .sudoku-cell.selected {
            background-color: rgba(43, 58, 85, 0.1);
            outline: 1px solid #2B3A55;
            outline-offset: -1px;
            z-index: 10;
        }
        .sudoku-cell.fixed {
            color: #1A1A1A;
            font-weight: 700;
        }
        .sudoku-cell.user-input {
            color: #2B3A55;
        }
    </style>
</head>

        document.querySelectorAll('.sudoku-cell').forEach(cell => {

            });
