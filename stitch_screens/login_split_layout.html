<style>
        /* Editorial Input Fields */
        .editorial-input {
            border: none;
            border-bottom: 1px solid #1A1A1A;
            border-radius: 0;
            padding-left: 0;
            padding-right: 0;
            background-color: transparent;
        }
        .editorial-input:focus {
            outline: none;
            box-shadow: none;
            border-bottom: 2px solid #2B3A55;
        }
    </style>
</head>
<body class="bg-surface text-ink-black min-h-screen antialiased flex flex-col md:flex-row">
<!-- Left Panel -->
<div class="bg-ink-black text-surface w-full md:w-1/2 min-h-[40vh] md:min-h-screen p-margin-md md:p-margin-lg flex flex-col justify-between">
<div>
<h1 class="font-display-lg text-[48px] uppercase tracking-widest text-surface">SUDOKU ARENA</h1>
</div>
<div class="mt-auto">
<p class="font-headline-md text-[32px] italic text-surface">Track every game.<br/>Master every grid.</p>
</div>
</div>
<!-- Right Panel (Main Content Canvas) -->
<main class="bg-surface w-full md:w-1/2 flex items-center justify-center p-margin-md md:p-margin-lg relative z-10">
<div class="w-full max-w-[360px]">
<!-- Headline -->
<div class="mb-margin-lg text-left">
<h2 class="font-display-lg text-[36px] uppercase tracking-widest text-ink-black">LOG IN</h2>
</div>
<!-- Login Form -->
<form action="#" class="space-y-margin-md" method="POST">
<!-- Email Field -->
<div class="flex flex-col">
<label class="font-grid-notes text-grid-notes text-note-gray uppercase tracking-widest mb-1" for="email">Email Address</label>
<input class="editorial-input font-body-md text-body-md text-ink-black py-2 w-full" id="email" name="email" placeholder="player@sudokuarena.com" required="" type="email"/>
</div>
<!-- Password Field -->
<div class="flex flex-col">
<div class="flex justify-between items-end mb-1">
<label class="font-grid-notes text-grid-notes text-note-gray uppercase tracking-widest" for="password">Password</label>
<a class="font-grid-notes text-grid-notes text-ink-blue hover:text-ink-black hover:underline transition-colors" href="#">Forgot Password?</a>
</div>
<input class="editorial-input font-body-md text-body-md text-ink-black py-2 w-full" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
<!-- Submit Button -->
<div class="pt-margin-sm">
<button class="w-full bg-ink-black text-surface font-label-mono text-label-mono uppercase tracking-[0.1em] py-4 rounded-none border border-ink-black hover:bg-surface hover:text-ink-black transition-colors flex justify-center items-center gap-2 group" type="submit">
                        LOG IN
                        <span class="material-symbols-outlined group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>
</div>
</form>
<!-- Registration Link -->
<div class="mt-margin-md text-left">
<a class="font-body-md text-body-md text-ink-black hover:underline transition-colors" href="#">New here? Create an account</a>
</div>
</div>
</main>
</body></html>
