<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Account Settings - Sudoku Arena</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;family=EB+Garamond:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "secondary": "#5f5e5e",
                        "on-secondary-container": "#636262",
                        "on-primary-container": "#95a4c4",
                        "ink-black": "#1A1A1A",
                        "primary-fixed": "#d7e3ff",
                        "outline": "#75777e",
                        "surface-container-low": "#f5f3ee",
                        "on-primary": "#ffffff",
                        "surface-variant": "#e4e2dd",
                        "paper-white": "#F7F5F0",
                        "secondary-container": "#e2dfde",
                        "surface-container-high": "#eae8e3",
                        "inverse-on-surface": "#f2f1ec",
                        "on-error": "#ffffff",
                        "inverse-primary": "#b7c7e8",
                        "tertiary-container": "#49370f",
                        "primary": "#15243e",
                        "inverse-surface": "#30312e",
                        "surface": "#fbf9f4",
                        "on-primary-fixed": "#0b1b35",
                        "error": "#ba1a1a",
                        "surface-dim": "#dbdad5",
                        "on-tertiary": "#ffffff",
                        "on-background": "#1b1c19",
                        "on-secondary-fixed-variant": "#474746",
                        "secondary-fixed-dim": "#c8c6c5",
                        "surface-container-lowest": "#ffffff",
                        "tertiary-fixed-dim": "#dfc38e",
                        "surface-tint": "#505f7c",
                        "note-gray": "#7A7875",
                        "on-tertiary-fixed-variant": "#57441b",
                        "error-container": "#ffdad6",
                        "on-surface-variant": "#44474d",
                        "tertiary-fixed": "#fddfa8",
                        "on-primary-fixed-variant": "#384763",
                        "on-tertiary-fixed": "#261900",
                        "on-secondary": "#ffffff",
                        "primary-fixed-dim": "#b7c7e8",
                        "secondary-fixed": "#e5e2e1",
                        "background": "#fbf9f4",
                        "primary-container": "#2b3a55",
                        "tertiary": "#312200",
                        "error-red": "#9E2A2B",
                        "on-error-container": "#93000a",
                        "ink-blue": "#2B3A55",
                        "surface-container-highest": "#e4e2dd",
                        "on-surface": "#1b1c19",
                        "outline-variant": "#c5c6ce",
                        "on-tertiary-container": "#baa06f",
                        "surface-container": "#f0eee9",
                        "on-secondary-fixed": "#1c1b1b",
                        "surface-bright": "#fbf9f4"
                    },
                    "borderRadius": {
                        "DEFAULT": "0rem",
                        "lg": "0rem",
                        "xl": "0rem",
                        "full": "0px"
                    },
                    "spacing": {
                        "grid-unit": "4px",
                        "hairline": "1px",
                        "margin-md": "32px",
                        "margin-lg": "64px",
                        "margin-sm": "16px",
                        "cell-size": "64px"
                    },
                    "fontFamily": {
                        "body-lg": ["Inter"],
                        "grid-number": ["JetBrains Mono"],
                        "body-md": ["Inter"],
                        "grid-notes": ["JetBrains Mono"],
                        "label-mono": ["JetBrains Mono"],
                        "headline-md": ["EB Garamond"],
                        "headline-sm": ["EB Garamond"],
                        "display-lg": ["EB Garamond"]
                    },
                    "fontSize": {
                        "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],
                        "grid-number": ["28px", {"lineHeight": "28px", "fontWeight": "400"}],
                        "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                        "grid-notes": ["12px", {"lineHeight": "12px", "fontWeight": "400"}],
                        "label-mono": ["20px", {"lineHeight": "20px", "fontWeight": "500"}],
                        "headline-md": ["32px", {"lineHeight": "40px", "fontWeight": "500"}],
                        "headline-sm": ["24px", {"lineHeight": "32px", "fontWeight": "500"}],
                        "display-lg": ["48px", {"lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "600"}]
                    }
                }
            }
        }
    </script>
<style>
        .input-underline {
            border: none;
            border-bottom: 1px solid #1A1A1A;
            background: transparent;
            padding: 8px 0;
            width: 100%;
            outline: none;
            border-radius: 0;
            box-shadow: none !important;
        }
        .input-underline:focus {
            border-bottom: 2px solid #1A1A1A;
        }
        .segmented-btn {
            border: 1px solid #1A1A1A;
            border-right: none;
        }
        .segmented-btn:last-child {
            border-right: 1px solid #1A1A1A;
        }
        .segmented-btn.active {
            background-color: #1A1A1A;
            color: #F7F5F0;
        }
    </style>
</head>
<body class="bg-paper-white text-ink-black font-body-md min-h-screen flex flex-col">
<!-- TopNavBar -->
<nav class="bg-paper-white dark:bg-ink-black w-full border-b border-ink-black dark:border-paper-white border-b hairline border-ink-black flex justify-between items-center px-margin-lg py-4 w-full max-w-full z-50">
<div class="font-headline-md text-headline-md font-bold text-ink-black dark:text-paper-white uppercase tracking-tighter">SUDOKU ARENA</div>
<div class="hidden md:flex gap-8 font-headline-sm text-headline-sm uppercase tracking-widest">
<a class="text-secondary dark:text-secondary-fixed-dim hover:bg-ink-black hover:text-paper-white dark:hover:bg-paper-white dark:hover:text-ink-black transition-colors duration-150 cursor-pointer" href="#">Play</a>
<a class="text-secondary dark:text-secondary-fixed-dim hover:bg-ink-black hover:text-paper-white dark:hover:bg-paper-white dark:hover:text-ink-black transition-colors duration-150 cursor-pointer" href="#">Learn</a>
<a class="text-secondary dark:text-secondary-fixed-dim hover:bg-ink-black hover:text-paper-white dark:hover:bg-paper-white dark:hover:text-ink-black transition-colors duration-150 cursor-pointer" href="#">Practice</a>
<a class="text-secondary dark:text-secondary-fixed-dim hover:bg-ink-black hover:text-paper-white dark:hover:bg-paper-white dark:hover:text-ink-black transition-colors duration-150 cursor-pointer" href="#">History</a>
</div>
<div class="flex gap-4">
<span class="material-symbols-outlined cursor-pointer hover:text-ink-black transition-colors duration-150" data-icon="account_circle">account_circle</span>
<span class="material-symbols-outlined cursor-pointer hover:text-ink-black transition-colors duration-150" data-icon="settings">settings</span>
</div>
</nav>
<!-- Main Content -->
<main class="flex-grow w-full max-w-[600px] mx-auto px-margin-sm md:px-0 py-margin-lg flex flex-col gap-12">
<!-- Header -->
<header class="w-full pb-4 border-b hairline border-ink-black">
<h1 class="font-headline-md text-headline-md uppercase tracking-widest">Account</h1>
</header>
<!-- Identity Section -->
<section class="flex gap-8 items-start pb-12 border-b hairline border-ink-black">
<div class="w-24 h-24 bg-ink-black text-paper-white flex items-center justify-center flex-shrink-0">
<span class="font-headline-md text-headline-md">JD</span>
</div>
<div class="flex flex-col gap-6 w-full pt-1">
<div>
<label class="font-label-mono text-grid-notes uppercase tracking-widest text-secondary block mb-1">Name</label>
<input class="input-underline font-body-lg text-body-lg" type="text" value="John Doe"/>
</div>
<div>
<label class="font-label-mono text-grid-notes uppercase tracking-widest text-secondary block mb-1">Email</label>
<input class="input-underline font-body-lg text-body-lg" type="email" value="john.doe@example.com"/>
</div>
</div>
</section>
<!-- Password Section -->
<section class="flex flex-col gap-6 pb-12 border-b hairline border-ink-black">
<h2 class="font-label-mono text-label-mono uppercase tracking-widest">Security</h2>
<div class="flex flex-col gap-6">
<div>
<label class="font-label-mono text-grid-notes uppercase tracking-widest text-secondary block mb-1">Current Password</label>
<input class="input-underline font-body-lg text-body-lg" type="password" value="********"/>
</div>
<div>
<label class="font-label-mono text-grid-notes uppercase tracking-widest text-secondary block mb-1">New Password</label>
<input class="input-underline font-body-lg text-body-lg" placeholder="Leave blank to keep current" type="password"/>
</div>
<button class="self-start font-label-mono text-grid-notes uppercase tracking-widest border-b hairline border-ink-black hover:border-b-2 transition-all mt-2">Update Password</button>
</div>
</section>
<!-- Preferences Section -->
<section class="flex flex-col gap-8 pb-12 border-b hairline border-ink-black">
<h2 class="font-label-mono text-label-mono uppercase tracking-widest">Preferences</h2>
<!-- Default Difficulty -->
<div class="flex flex-col gap-3">
<label class="font-label-mono text-grid-notes uppercase tracking-widest text-secondary block">Default Difficulty</label>
<div class="flex w-full">
<button class="segmented-btn flex-1 py-2 font-label-mono text-grid-notes uppercase tracking-widest hover:bg-surface-variant transition-colors">Easy</button>
<button class="segmented-btn flex-1 py-2 font-label-mono text-grid-notes uppercase tracking-widest active transition-colors">Medium</button>
<button class="segmented-btn flex-1 py-2 font-label-mono text-grid-notes uppercase tracking-widest hover:bg-surface-variant transition-colors">Hard</button>
<button class="segmented-btn flex-1 py-2 font-label-mono text-grid-notes uppercase tracking-widest hover:bg-surface-variant transition-colors">Expert</button>
</div>
</div>
<!-- Notes Mode Default -->
<div class="flex items-center justify-between mt-4">
<label class="font-label-mono text-grid-notes uppercase tracking-widest text-secondary">Notes Mode Default</label>
<div class="flex gap-2 font-grid-number text-grid-number">
<button class="hover:opacity-70 transition-opacity">[ON]</button>
<button class="text-secondary opacity-50 hover:opacity-100 transition-opacity">[OFF]</button>
</div>
</div>
<!-- Theme -->
<div class="flex items-center justify-between mt-4">
<label class="font-label-mono text-grid-notes uppercase tracking-widest text-secondary">Theme</label>
<div class="flex gap-4">
<button class="w-8 h-8 bg-paper-white border border-ink-black shadow-[0_0_0_2px_#1A1A1A]"></button>
<button class="w-8 h-8 bg-ink-black border border-ink-black hover:shadow-[0_0_0_1px_#1A1A1A]"></button>
</div>
</div>
</section>
<!-- Bottom Actions -->
<section class="flex flex-col gap-6 items-center pt-4">
<button class="w-full bg-ink-black text-paper-white font-label-mono text-label-mono uppercase tracking-widest py-4 hover:bg-primary-container transition-colors">
                SAVE CHANGES
            </button>
<button class="font-label-mono text-grid-notes text-secondary hover:text-ink-black transition-colors underline">
                Delete Account
            </button>
</section>
</main>
<!-- Footer -->
<footer class="bg-paper-white dark:bg-ink-black w-full border-t border-ink-black dark:border-paper-white border-t hairline border-ink-black flex flex-col md:flex-row justify-between items-center px-margin-lg py-8 mt-auto">
<div class="font-headline-sm text-headline-sm text-ink-black dark:text-paper-white">
            © 2024 SUDOKU ARENA. AN EDITORIAL LOGIC PLATFORM.
        </div>
<div class="flex gap-6 mt-4 md:mt-0 font-label-mono text-grid-notes uppercase tracking-widest">
<a class="text-secondary hover:text-ink-black underline transition-colors" href="#">Terms</a>
<a class="text-secondary hover:text-ink-black underline transition-colors" href="#">Privacy</a>
<a class="text-secondary hover:text-ink-black underline transition-colors" href="#">Archive</a>
</div>
</footer>
</body></html>
